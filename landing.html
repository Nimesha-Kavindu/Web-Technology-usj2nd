<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholar Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: linear-gradient(#ffffff, #eef2f7);
      color: #333;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      aspect-ratio: 16 / 9;
      width: 100%;
      height: 100%;
      object-fit: cover;
    
      z-index: -1;
    }

    nav {
      display: flex;
      justify-content: flex-end;
      padding: 20px;
      background: #6ca0e5;
      z-index: 1;
      position: relative;
    }

    nav a {
      margin-left: 40px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 16px;
    }

    .hero {
      text-align: center;
      
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      padding: 150px 20px 40px;
      font-size: 100px;
      color: #3e6fa8;
      position: center;
    }

    .hero p {
      font-size: 19px;
      padding: 2px 2px 0px;
      color: #2036d7;
      margin-bottom: 4px;
      text-align:left;
    }

    .tagline {
      display: inline-block;
      background: #153a5b;
      color: #cce9ff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 2px;
    }

    
  </style>
</head>
<body>
  <video autoplay muted loop playsinline id="bg-video">
    <source src="hand.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <nav>
    <a href="#">Home</a>
    <a href="#">Contact</a>
    <a href="#">Service</a>
    <a href="#">Login</a>
  </nav>

  <div class="hero">
    <p>welcome to</p>
    <h1>scholar connect</h1>
    <div class="tagline">connect academic minds for <strong>research excellence</strong></div>
  </div>

  
</body>
</html>
